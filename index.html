<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนสลิปค่าจอดรถด้วย AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-lg w-full border border-slate-700">
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 text-blue-400 rounded-full mb-3">
                <i class="fa-solid fa-file-invoice-dollar text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">ระบบแกะยอดเงินสลิปจอดรถ</h1>
            <p class="text-slate-400 text-sm mt-1">อัปโหลดสลิปหรือใบเสร็จ (AI จะดึงยอดเงินให้อัตโนมัติ)</p>
        </div>

        <form id="parkingForm" class="space-y-5">
            <!-- Drop Zone / File Input -->
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">อัปโหลดไฟล์ (JPG, PNG, PDF)</label>
                <div id="dropZone" class="border-2 border-dashed border-slate-600 hover:border-blue-500 rounded-xl p-6 text-center cursor-pointer transition bg-slate-800/50 hover:bg-slate-700/50">
                    <input type="file" id="fileInput" accept="image/*,.pdf" class="hidden">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-400 mb-2" id="uploadIcon"></i>
                    <p id="fileNameDisplay" class="text-sm text-slate-300 font-medium">คลิกเพื่อเลือกไฟล์ หรือลากไฟล์มาวางที่นี่</p>
                    <p class="text-xs text-slate-500 mt-1">รองรับขนาดไม่เกิน 10MB</p>
                </div>
            </div>

            <!-- Preview Container -->
            <div id="previewContainer" class="hidden text-center">
                <img id="imagePreview" class="max-h-48 mx-auto rounded-lg border border-slate-600 shadow-md hidden" alt="Slip Preview">
                <div id="pdfPreview" class="hidden p-4 bg-slate-700/50 rounded-lg text-slate-300 text-sm">
                    <i class="fa-solid fa-file-pdf text-red-400 text-2xl mb-1"></i>
                    <p id="pdfName">ไฟล์ PDF ถูกเลือกแล้ว</p>
                </div>
            </div>

            <!-- Amount Input -->
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">ยอดเงินค่าจอดรถที่ตรวจพบ (บาท)</label>
                <div class="relative">
                    <input type="number" id="amountInput" step="0.01" placeholder="0.00" required
                        class="w-full pl-4 pr-12 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-xl font-mono font-bold">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">บาท</span>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>บันทึกข้อมูล</span>
            </button>
        </form>

        <!-- Loading Overlay -->
        <div id="loading" class="hidden mt-6 text-center bg-blue-950/40 p-4 rounded-xl border border-blue-800/50">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-3 border-blue-400 border-t-transparent mb-2"></div>
            <p class="text-blue-300 text-sm font-medium">กำลังประมวลผลสลิปด้วย AI...</p>
            <p class="text-slate-400 text-xs mt-1">โปรดรอสักครู่ ระบบกำลังแกะตัวเลขยอดเงิน</p>
        </div>

        <!-- Alert Notification -->
        <div id="alertBox" class="hidden mt-4 p-3 rounded-lg text-xs font-medium"></div>
    </div>

    <script>
        // 🚨 อย่าลืมตรวจสอบและแก้ไข URL Backend ของคุณตรงนี้
        const BACKEND_URL = "https://parking-backend-o2e3.onrender.com";

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const amountInput = document.getElementById('amountInput');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        const imagePreview = document.getElementById('imagePreview');
        const pdfPreview = document.getElementById('pdfPreview');
        const previewContainer = document.getElementById('previewContainer');

        // Drag & Drop Handlers
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-blue-500'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        async function handleFileSelect(file) {
            fileNameDisplay.innerText = file.name;
            showAlert("", "hide");

            // Handle Preview
            previewContainer.classList.remove('hidden');
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                    pdfPreview.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            } else if (file.type === 'application/pdf') {
                imagePreview.classList.add('hidden');
                pdfPreview.classList.remove('hidden');
                document.getElementById('pdfName').innerText = file.name;
            }

            // Trigger AI Extraction
            await processFileWithAI(file);
        }

        async function processFileWithAI(file) {
            const formData = new FormData();
            formData.append('file', file);

            loading.classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/extract`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                console.log("Backend Response:", data);

                if (data.success && data.amount > 0) {
                    amountInput.value = data.amount.toFixed(2);
                    showAlert(`อ่านยอดเงินสำเร็จ: ฿${data.amount.toFixed(2)}`, "success");
                } else {
                    showAlert(data.error || "ระบบไม่พบบทสรุปยอดเงิน โปรดระบุด้วยตนเอง", "warning");
                    const userAmount = prompt("ระบบแกะยอดเงินอัตโนมัติไม่สำเร็จ โปรดระบุยอดเงินค่าจอดรถ (บาท):", "0.00");
                    if (userAmount !== null) {
                        amountInput.value = parseFloat(userAmount) || 0;
                    }
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อกับ Backend Server", "error");
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }

        function showAlert(msg, type) {
            if (type === "hide") {
                alertBox.classList.add('hidden');
                return;
            }
            alertBox.classList.remove('hidden', 'bg-emerald-900/50', 'text-emerald-300', 'bg-amber-900/50', 'text-amber-300', 'bg-rose-900/50', 'text-rose-300');
            if (type === "success") alertBox.classList.add('bg-emerald-900/50', 'text-emerald-300', 'border', 'border-emerald-700');
            if (type === "warning") alertBox.classList.add('bg-amber-900/50', 'text-amber-300', 'border', 'border-amber-700');
            if (type === "error") alertBox.classList.add('bg-rose-900/50', 'text-rose-300', 'border', 'border-rose-700');
            alertBox.innerText = msg;
        }
    </script>
</body>
</html>
